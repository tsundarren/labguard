name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labguard
          POSTGRES_PASSWORD: labguard
          POSTGRES_DB: labguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labguard"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://labguard:labguard@localhost:5432/labguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
